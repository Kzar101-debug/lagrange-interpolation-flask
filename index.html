<h1>Example 2</h1>

<p><b>Given:</b> (1,1), (3,9), find f(2)</p>

<h2>Step 1: Formula</h2>

<p>
$$P(x)=y_0L_0(x)+y_1L_1(x)$$
</p>

<h2>Step 2: Compute L₀(2)</h2>

<p>
$$L_0(2)=\frac{2-3}{1-3}=0.5$$
</p>

<h2>Step 3: Compute L₁(2)</h2>

<p>
$$L_1(2)=\frac{2-1}{3-1}=0.5$$
</p>

<h2>Step 4: Final Answer</h2>

<p>
$$P(2)=1(0.5)+9(0.5)=5$$
</p>

<h2><b>Final Answer: 5</b></h2>
