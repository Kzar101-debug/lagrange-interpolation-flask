<h1>Example 2</h1>

<p><b>Given:</b> (1,1), (3,9), find f(2)</p>

$$P(x)=y_0L_0(x)+y_1L_1(x)$$

$$L_0(2)=\frac{2-3}{1-3}=0.5$$

$$L_1(2)=\frac{2-1}{3-1}=0.5$$

$$P(2)=1(0.5)+9(0.5)=5$$

<h2 class="answer">Final Answer: 5</h2>
